name: Runtime comparison and three-scale candidate qualification

on:
  pull_request:
    paths:
      - "projects/runtime-comparison/**"
      - ".github/workflows/runtime-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-oracle:
    name: Three-way Rust correctness replay
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Resolve exact feature revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected="$PULL_REQUEST_HEAD_SHA" ;;
            workflow_dispatch) expected="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout
        env:
          EXPECTED: ${{ steps.revision.outputs.expected }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "Exact head: $EXPECTED"

      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Record toolchain and dependency revision
        run: |
          rustc --version
          cargo --version
          git rev-parse HEAD

      - name: Verify restricted generator output
        run: python3 projects/runtime-comparison/tools/compile_rule.py --check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path projects/runtime-comparison/Cargo.toml --all -- --check

      - name: Compile and replay both independent oracles
        run: cargo test --manifest-path projects/runtime-comparison/Cargo.toml --all-targets --locked

      - name: Enforce strict Clippy
        run: cargo clippy --manifest-path projects/runtime-comparison/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run optimized three-way replay
        run: cargo run --manifest-path projects/runtime-comparison/Cargo.toml --release --locked

      - name: Record benchmark hardware and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-comparison"
          {
            echo "Revision: $(git rev-parse HEAD)"
            echo "OS: $(uname -a)"
            rustc -Vv
            cargo --version
            lscpu
          } > "$RUNNER_TEMP/runtime-comparison/environment.txt"

      - name: Collect alternating same-host Release samples
        run: |
          python3 projects/runtime-comparison/tools/run_benchmarks.py \
            --binary projects/runtime-comparison/target/release/runtime-comparison \
            --output "$RUNNER_TEMP/runtime-comparison/raw.csv" \
            --rounds 3 --objects 1024 65536 --timeout 240

      - name: Collect separately instrumented stage diagnostics
        run: |
          set -euo pipefail
          {
            echo "Diagnostic timestamps change the measurement; not a performance ranking."
            for size in 1024 65536; do
              for workload in noop sparse dense fanout reassign; do
                projects/runtime-comparison/target/release/runtime-comparison \
                  --diagnostic tde "$workload" "$size" 100
              done
              projects/runtime-comparison/target/release/runtime-comparison \
                --diagnostic runen noop "$size" 100
            done
          } > "$RUNNER_TEMP/runtime-comparison/diagnostics.txt"

      - name: Preserve raw exploratory benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-comparison-${{ steps.revision.outputs.expected }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/runtime-comparison/**

  million-scale:
    name: Million-object comparison (isolated, failure-aware)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Resolve PR head
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected="$PR_SHA" ;;
            workflow_dispatch) expected="$EVENT_SHA" ;;
            *) exit 1 ;;
          esac
          test -n "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source
        env:
          EXPECTED: ${{ steps.revision.outputs.expected }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build locked release candidate
        run: cargo build --manifest-path projects/runtime-comparison/Cargo.toml --release --locked

      - name: Record host resources
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-million"
          {
            git rev-parse HEAD
            rustc -Vv
            uname -a
            lscpu
            free -h
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          } > "$RUNNER_TEMP/runtime-million/environment.txt"

      - name: Run million-object benchmark with explicit failures
        run: |
          python3 projects/runtime-comparison/tools/run_benchmarks.py \
            --binary projects/runtime-comparison/target/release/runtime-comparison \
            --output "$RUNNER_TEMP/runtime-million/raw.csv" \
            --rounds 3 --objects 1000000 --timeout 240 --allow-incomplete

      - name: Preserve raw million-scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-million-${{ steps.revision.outputs.expected }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/runtime-million/**
