name: Game transform hierarchy qualification

on:
  pull_request:
    paths:
      - "projects/transform-hierarchy/**"
      - ".github/workflows/transform-hierarchy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-proof:
    name: Exact-head typed Rust consumer and semantic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Resolve exact source
        id: revision
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) target="$PR_SHA" ;;
            workflow_dispatch) target="$SHA" ;;
            *) exit 1 ;;
          esac
          test -n "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        env:
          EXPECTED: ${{ steps.revision.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Locked package
        run: cargo metadata --manifest-path projects/transform-hierarchy/Cargo.toml --locked --no-deps --format-version 1 > /dev/null

      - name: Rustfmt
        run: cargo fmt --manifest-path projects/transform-hierarchy/Cargo.toml --all -- --check

      - name: Semantic and consumer tests
        run: cargo test --manifest-path projects/transform-hierarchy/Cargo.toml --all-targets --locked

      - name: Strict Clippy
        run: cargo clippy --manifest-path projects/transform-hierarchy/Cargo.toml --all-targets --locked -- -D warnings

      - name: Optimized semantic replay
        run: cargo test --manifest-path projects/transform-hierarchy/Cargo.toml --release --all-targets --locked
