name: Todo native X11 Release qualification

on:
  pull_request:
    paths:
      - "projects/todo/**"
      - ".github/workflows/todo-native-x11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  todo-native-x11:
    name: Todo Release X11 input and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Resolve exact feature revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected="$PULL_REQUEST_HEAD_SHA" ;;
            workflow_dispatch) expected="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Check out exact feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out revision
        env:
          EXPECTED: ${{ steps.revision.outputs.expected }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected revision: $EXPECTED"
          echo "Checked-out revision: $actual"
          test "$actual" = "$EXPECTED"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install X11 and software Vulkan runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth xdotool openbox libxkbcommon-x11-0 fonts-cantarell
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name "lvp_icd*.json" -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/todo-native-xdg" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/todo-native-xdg"
          chmod 700 "$RUNNER_TEMP/todo-native-xdg"

      - name: Prove software Vulkan adapter
        run: vulkaninfo --summary

      - name: Build the actual independent Todo Release binary
        run: cargo +stable build --manifest-path projects/todo/Cargo.toml --release --locked

      - name: Run original X11 mouse and keyboard interaction
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          timeout 150s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            bash projects/todo/scripts/native-x11-smoke.sh
